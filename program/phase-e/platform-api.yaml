components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: "The SOS access token (handed over with a one-time code, never in a URL; D-017)."
  parameters:
    Workspace:
      name: X-Workspace
      in: header
      required: false
      schema:
        type: string
      description: "Workspace id; defaults to the person's first workspace."
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
  schemas:
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
            - requestId
          properties:
            code:
              type: string
              examples:
                - invalid
                - forbidden
                - wrong_state
                - not_found
                - payment_failed
            message:
              type: string
            requestId:
              type: string
            fieldErrors:
              type: object
              additionalProperties:
                type: string
            required:
              type: string
              description: The missing permission or role
    Envelope:
      type: object
      required:
        - data
        - meta
      properties:
        data: {}
        meta:
          type: object
    Localized:
      type: object
      properties:
        en:
          type: string
        ar:
          type: string
        de:
          type: string
        fr:
          type: string
        it:
          type: string
      required:
        - en
    Money:
      type: object
      properties:
        amount:
          type: number
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
      description: Amounts use major currency units at currency precision (KWD/BHD/OMR three decimals). Website offer schemas explicitly use integer minor units.
    Tool:
      type: object
      properties:
        key:
          type: string
        name:
          $ref: "#/components/schemas/Localized"
        status:
          enum:
            - coming_soon
            - beta
            - live
            - retired
        mandatory:
          type: boolean
    ToolState:
      enum:
        - active
        - trial
        - beta
        - read_only
        - not_subscribed
        - no_access
        - coming_soon
      description: USR-00 derived tool state
    Plan:
      type: object
      properties:
        id:
          type: string
        tool:
          type: string
        tier:
          type: string
        name:
          $ref: "#/components/schemas/Localized"

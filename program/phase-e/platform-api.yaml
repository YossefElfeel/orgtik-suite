          enum:
            - card
            - twint
            - paypal
        billing:
          $ref: "#/components/schemas/WebsiteBilling"
      additionalProperties: false
      description: "Idempotent by reference plus quote/payment/billing fingerprint; TWINT only for CH/CHF. No amount/currency/receipt can replace the stored server quote."
    WebsiteOrder:
      type: object
      required:
        - version
        - reference
        - paymentStatus
        - createdAt
        - currency
        - region
        - policy
        - quoteId
        - groups
        - quote
      properties:
        version:
          const: 1
        reference:
          type: string
        paymentStatus:
          enum:
            - succeeded
            - failed
        paymentMethod:
          enum:
            - card
            - twint
            - paypal
        createdAt:
          type: string
          format: date-time
        currency:
          type: string
        decimals:
          type: integer
        region:
          $ref: "#/components/schemas/WebsiteRegion"
        policy:
          $ref: "#/components/schemas/WebsitePolicy"
        quoteId:
          type: string
        groups:
          type: array
          items:
            $ref: "#/components/schemas/WebsiteGroup"
        quote:
          $ref: "#/components/schemas/WebsiteTotals"
        claimToken:
          type: string
          x-sensitive: true
          description: "Successful payment claim used only in the authenticated link body; never put it in a URL."
        failure:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
      readOnly: true
      description: "Immutable server payment snapshot. Failed payment is a 200 response with failed status and no claim/provisioning; successful payment precedes account linking."
    WebsiteLinkBody:
      type: object
      required:
        - reference
        - claimToken
      properties:
        reference:
          type: string
        claimToken:
          type: string
          writeOnly: true
          x-sensitive: true
      additionalProperties: false
      description: "Only the server-paid order claim; browser lines, totals and currency are rejected."
    WebsiteLinkResult:
      type: object
      required:
        - reference
        - workspaceId
        - tools
        - requests
        - invoice
      properties:
        reference:
          type: string
        workspaceId:
          type: string
        at:
          type: string
          format: date-time
        tools:
          type: array
          items:
            type: object
            properties:
              catalogId:
                type: string
              lineId:
                type: string
              state:
                const: active
              termMonths:
                enum:
                  - 1
                  - 3
                  - 6
                  - 12
              quantity:
                type: integer
        requests:
          type: array
          items:
            type: object
            properties:
              catalogId:
                type: string
              requestId:
                type: string
              state:
                const: new
        skipped:
          type: array
          items: {}
        invoice:
          type: object
          properties:
            id:
              type: string
            number:
              type: string
            total:
              type: number
              description: Major currency units, rounded to currency decimals.
            currency:
              type: string
      description: Repeated valid link returns the same result without duplicate provisioning. A signup-marked, single-owner workspace containing only unpaid General and no invoices/requests may initialize its first billing region from a verified guest order. Existing workspace currencies and immutable paid orders are never converted.

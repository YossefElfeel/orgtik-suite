components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: "The SOS access token (handed over with a one-time code, never in a URL; D-017)."
  parameters:
    Workspace:
      name: X-Workspace
      in: header
      required: false
      schema:
        type: string
      description: "Workspace id; defaults to the person's first workspace."
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
  schemas:
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
            - requestId
          properties:
            code:
              type: string
              examples:
                - invalid
                - forbidden
                - wrong_state
                - not_found
                - payment_failed
            message:
              type: string
            requestId:
              type: string
            fieldErrors:
              type: object
              additionalProperties:
                type: string
            required:
              type: string
              description: The missing permission or role
    Envelope:
      type: object
      required:
        - data
        - meta
      properties:
        data: {}
        meta:
          type: object
    Localized:
      type: object
      properties:
        en:
          type: string
        ar:
          type: string
        de:
          type: string
        fr:
          type: string
        it:
          type: string
      required:
        - en
    Money:
      type: object
      properties:
        amount:
          type: number
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
      description: Amounts are in the currency's minor-unit precision (KWD/BHD/OMR 3 decimals).
    Tool:
      type: object
      properties:
        key:
          type: string
        name:
          $ref: "#/components/schemas/Localized"
        status:
          enum:
            - coming_soon
            - beta
            - live
            - retired
        mandatory:
          type: boolean
    ToolState:
      enum:
        - active
        - trial
        - beta
        - read_only
        - not_subscribed
        - no_access
        - coming_soon
      description: USR-00 derived tool state
    Plan:
      type: object
      properties:
        id:
          type: string
        tool:
          type: string
        tier:
          type: string
        name:
          $ref: "#/components/schemas/Localized"
        perUser:
          type: boolean
        minSeats:
          type: integer
        trialDays:
          type: integer
        yearlyDiscountPct:
          type: number
        limits:
          type: object
        flags:
          type: object
        visibility:
          enum:
            - public
            - private
    Line:
      type: object
      description: "A subscription line (state table: Subscription line)"
      properties:
        id:
          type: string
        tool:
          type: string
        planId:
          type: string
        cycle:
          enum:
            - monthly
            - yearly
        state:
          enum:
            - free
            - trialing
            - active
            - past_due
            - read_only
            - cancelling
            - ended
            - deleted
        periodEnd:
          type: string
          format: date-time
        trialEndsAt:
          type: string
          format: date-time
        graceEndsAt:
          type: string
          format: date-time
        cancelAt:
          type: string
          format: date-time
        snapshot:
          type: object
          description: The price the line pays (R03-P1)
          properties:
            amount:
              type: number
            unit:
              type: number
            quantity:
              type: integer
            currency:
              type: string
            source:
              enum:
                - Zone
                - Zone (converted)
                - Country
                - Default
                - Free
            priceVersion:
              type: integer
        scheduled:
          type: object
          properties:
            kind:
              enum:
                - price_change
                - downgrade
            effectiveAt:
              type: string
              format: date-time
    Workspace:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        country:
          type: string
        currency:
          type: string
        currencyLocked:
          type: boolean
        state:
          enum:
            - active
            - past_due
            - suspended
            - cancelled
            - deleted
    Invoice:
      type: object
      description: "State table: Invoice"
      properties:
        id:
          type: string
        number:
          type: string
          examples:
            - INV-2026-001041
        state:
          enum:
            - draft
            - open
            - paid
            - past_due
            - void
            - partially_refunded
            - refunded
        currency:
          type: string
        subtotal:
          type: number
        tax:
          type: number
        taxLabel:
          type:
            - string
            - "null"
        total:
          type: number
        refunded:
          type: number
        payments:
          type: array
          items:
            type: object
        creditNotes:
          type: array
          items:
            type: object
    Banner:
      type: object
      properties:
        kind:
          enum:
            - suspended
            - read_only
            - payment_failed
            - trial_ending
            - beta_billing
            - price_change
            - downgrade_scheduled
        tone:
          enum:
            - danger
            - warning
            - info
            - neutral
        audience:
          type: string
        action:
          type:
            - string
            - "null"
    ServiceRequest:
      type: object
      description: "State table: Service request"
      properties:
        id:
          type: string
        number:
          type: string
        state:
          enum:
            - new
            - under_review
            - quoted
            - awaiting_payment
            - in_progress
            - in_review
            - on_hold
            - completed
            - rejected
            - expired
            - cancelled
    Ticket:
      type: object
      description: "State table: Support ticket"
      properties:
        id:
          type: string
        number:
          type: string
        state:
          enum:

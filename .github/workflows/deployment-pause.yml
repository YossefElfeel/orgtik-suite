name: Deployment pause configuration
on:
  pull_request:
  push:
    branches: [main]
jobs:
  configuration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate every configured Git deployment is disabled
        run: |
          node -e "const fs=require('fs');for(const dir of ['admin','chats','content','files','hr','marketing','sales','sos','tasks','wm'].map(n=>'apps/'+n).concat(['apps/website/landing-directions','mock'])){const c=JSON.parse(fs.readFileSync(dir+'/vercel.json','utf8'));if(c.git?.deploymentEnabled!==false)throw Error(dir)}"

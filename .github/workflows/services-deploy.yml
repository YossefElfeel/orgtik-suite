name: Deploy split Services projects

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orgtik-suite-services-production
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      - run: pnpm install --frozen-lockfile
      - name: Validate the reviewed source and split configuration
        run: |
          node tools/services/projects.mjs --check
          pnpm --filter @orgtik/ui run build
          pnpm turbo run typecheck i18n:check --filter='!docs' --filter='!content-dashboard-somion' --continue --concurrency=2
          node --test tools/services/services.test.mjs packages/ui/src/auth/client.test.mjs packages/ui/src/auth/access.test.mjs packages/ui/src/auth/urls.test.mjs
          node --test mock/lib/session-store.test.js mock/lib/session-authority.test.js mock/lib/journal-concurrency.test.js
          node tools/ci/secret-scan.mjs

  frontend:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        service: [admin, chats, files, hr, marketing, sales, sos, tasks, wm]
    env:
      SERVICE: ${{ matrix.service }}
      CONFIG: vercel.${{ matrix.service }}.json
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      - run: pnpm install --frozen-lockfile
      - run: npm install --global vercel@63.1.2
      - name: Configure the confirmed frontend project and private Redis backend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node tools/services/provision.mjs "$SERVICE"
      - name: Pull and build this frontend with its private mock service
        run: |
          vercel --global-config "$ORGTIK_VERCEL_CONFIG" --scope team_Ypx8oiLDZi3PBNi8ht8fYPsm --local-config "$CONFIG" pull --yes --environment=production
          vercel --global-config "$ORGTIK_VERCEL_CONFIG" --scope team_Ypx8oiLDZi3PBNi8ht8fYPsm --local-config "$CONFIG" build --prod
      - name: Preserve the backend and enforce the twelve-function limit
        run: |
          pnpm --filter orgtik-local-dev --prod deploy .vercel/mock-runtime
          node tools/services/package-mock.mjs
          node tools/services/check-artifact.mjs
      - name: Stage, verify and promote this frontend
        run: |
          vercel --global-config "$ORGTIK_VERCEL_CONFIG" --scope team_Ypx8oiLDZi3PBNi8ht8fYPsm --local-config "$CONFIG" deploy --prebuilt --archive=tgz --prod --skip-domain > services-deploy-output.txt
          node tools/vercel/deploy-url.mjs < services-deploy-output.txt > services-deploy-url.txt
          url=$(cat services-deploy-url.txt)
          node tools/services/verify-hosted.mjs "$url" --via-cli --service "$SERVICE"
          vercel --global-config "$ORGTIK_VERCEL_CONFIG" --scope team_Ypx8oiLDZi3PBNi8ht8fYPsm --local-config "$CONFIG" promote "$url" --yes
          echo "$SERVICE deployment: $url" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove transient CLI credentials
        if: always()
        run: |
          if [ -n "$ORGTIK_VERCEL_CONFIG" ] && [ "$ORGTIK_VERCEL_CONFIG" = "$RUNNER_TEMP/orgtik-services-cli/com.vercel.cli" ]; then
            rm -f "$ORGTIK_VERCEL_CONFIG/auth.json"
          fi

  website:
    needs: [validate, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      - run: pnpm install --frozen-lockfile
      - run: npm install --global vercel@63.1.2
      - name: Configure the confirmed website and router project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node tools/services/provision.mjs website
      - name: Build and stage the website after all frontends are ready
        run: |
          vercel --global-config "$ORGTIK_VERCEL_CONFIG" --scope team_Ypx8oiLDZi3PBNi8ht8fYPsm pull --yes --environment=production
          vercel --global-config "$ORGTIK_VERCEL_CONFIG" --scope team_Ypx8oiLDZi3PBNi8ht8fYPsm build --prod
          node tools/services/check-artifact.mjs
          vercel --global-config "$ORGTIK_VERCEL_CONFIG" --scope team_Ypx8oiLDZi3PBNi8ht8fYPsm deploy --prebuilt --archive=tgz --prod --skip-domain > services-deploy-output.txt
          node tools/vercel/deploy-url.mjs < services-deploy-output.txt > services-deploy-url.txt
      - name: Verify routing, promote the shared domain, and verify staff sign-in
        run: |
          url=$(cat services-deploy-url.txt)
          node tools/services/verify-hosted.mjs "$url" --via-cli
          vercel --global-config "$ORGTIK_VERCEL_CONFIG" --scope team_Ypx8oiLDZi3PBNi8ht8fYPsm promote "$url" --yes
          node tools/services/verify-hosted.mjs https://orgtik-suite-services.vercel.app
          echo "Website/router deployment: $url" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove transient CLI credentials
        if: always()
        run: |
          if [ -n "$ORGTIK_VERCEL_CONFIG" ] && [ "$ORGTIK_VERCEL_CONFIG" = "$RUNNER_TEMP/orgtik-services-cli/com.vercel.cli" ]; then
            rm -f "$ORGTIK_VERCEL_CONFIG/auth.json"
          fi
